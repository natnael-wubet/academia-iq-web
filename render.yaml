databases:
  - name: academia-iq-db
    databaseName: academia_iq
    user: academia
    plan: free

services:
  - type: web
    name: academia-iq-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: academia-iq-db
          property: connectionString
      - key: MAILTO
        value: hello@academia-iq.dev
      - key: GROQ_API_KEY
        sync: false
      - key: WEAVIATE_URL
        sync: false
      - key: WEAVIATE_API_KEY
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
